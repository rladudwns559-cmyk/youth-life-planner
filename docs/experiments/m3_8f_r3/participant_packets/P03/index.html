<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI+X 설명 이해도 비교 · 로컬 실험</title>
<style>
:root{font-family:system-ui,'맑은 고딕',sans-serif;color:#203349;background:#f2f5f8;line-height:1.65}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:auto;padding:24px}header{margin-bottom:24px}h1{font-size:27px;line-height:1.35}h2{font-size:20px}h3{font-size:17px}section,.card{background:white;border:1px solid #d5dfe8;border-radius:12px;padding:20px;margin:16px 0}.notice{background:#fff6df;border-left:4px solid #976b07;padding:14px}.muted{color:#576b7c;font-size:14px}button{padding:12px 18px;border:0;border-radius:7px;background:#175e81;color:white;font:inherit;cursor:pointer;margin:5px 5px 5px 0}button.secondary{background:#e5edf3;color:#294254}button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{max-width:100%}label{display:block;margin:8px 0;cursor:pointer}input[type=radio],input[type=checkbox]{margin:0 9px 0 0;accent-color:#175e81}fieldset{border:1px solid #d4dee8;border-radius:8px;margin:18px 0;padding:14px}legend{padding:0 6px;font-weight:650}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dce4eb;padding:9px;text-align:left;overflow-wrap:anywhere}th{background:#f1f6fa}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pill{font-size:13px;background:#e7f1f6;border-radius:5px;padding:4px 7px}textarea{width:100%;min-height:80px;font:inherit;padding:10px}details{margin:14px 0}summary{cursor:pointer}#message{color:#954100;font-weight:600}a{color:#165c7e}@media(max-width:600px){main{padding:14px}.columns{display:block}h1{font-size:23px}section,.card{padding:14px}td,th{padding:7px 4px}}
</style>
<main><header><span class="pill">AI+X · 합성 사용자와 합성 정책만 사용</span><h1>설명을 읽고 결과를 이해해 주세요</h1><p>같은 계산 결과를 서로 다른 방식으로 설명합니다. 어떤 방식이 더 좋은지는 아직 확인되지 않았습니다.</p></header>
<div id="message" role="status"></div><div id="app"></div></main>
<script>
'use strict';
let session=null,records=[],position=0,phase='load',started=0,interrupted=false,consented=false,finished=false;
const app=document.querySelector('#app'),msg=document.querySelector('#message');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status={PASS:'이용 가능성 높음 (PASS)',FAIL:'현재 조건과 맞지 않음 (FAIL)',UNKNOWN:'추가 확인 필요 (UNKNOWN)'};
const labels={age:'나이',region:'지역',student_status:'학생 여부',employment_status:'취업 상태',monthly_income:'월소득',monthly_rent:'월세',monthly_fixed_expenses:'고정지출',other_monthly_expenses:'기타지출',user_savings_capacity:'저축 투입 상한',household_income:'정책 기준 가구소득'};
const value=v=>v===null?'미입력':v===true?'학생':v===false?'학생 아님':v==='employed'?'취업':v==='unemployed'?'미취업':typeof v==='number'?v.toLocaleString('ko-KR'):escape(v);
function load(){app.innerHTML=`<section><h2>실험 자료 열기</h2><p>연구자가 배정한 세션 JSON을 선택하세요. 이름·실제 소득·계좌정보를 입력하지 않습니다.</p><input type="file" id="file" accept=".json,application/json"><p><button id="preview" class="secondary">합성 자료로 도구 미리보기</button></p><p class="notice">8개 과제의 설명 자료가 준비됐습니다. 실제 평가는 참여 동의 후 진행합니다. 미리보기는 합성 QA입니다.</p></section>`;
document.querySelector('#file').onchange=async e=>{try{accept(JSON.parse(await e.target.files[0].text()));}catch(err){msg.textContent='자료를 열 수 없습니다: '+err.message;}};
document.querySelector('#preview').onclick=async()=>{try{const r=await fetch('sessions/QA_SYN001.json');if(!r.ok)throw Error('로컬 서버에서 열거나 연구자가 제공한 QA JSON을 선택하세요.');accept(await r.json());}catch(err){msg.textContent=err.message;}};}
function accept(data){if(!data||!Array.isArray(data.tasks)||!data.tasks.length||data.tasks.some(t=>!t.document))throw Error('완료된 문장 자료가 아닙니다.');if(data.data_kind!=='synthetic'&&!data.ready)throw Error('실험 자료 준비가 완료되지 않았습니다. 사람 실험은 시작할 수 없습니다.');session=data;consent();}
function consent(){phase='consent';msg.textContent='';app.innerHTML=`<section><h2>${session.preview_only?'도구 확인용 합성 미리보기':'참여 안내와 동의'}</h2><p>참가자 ID: <strong>${escape(session.participant_id)}</strong>. ${session.tasks.length}개 과제. 예상 15~25분이며 실제 소요시간은 아직 측정하지 않았습니다.</p><p>이 자료에는 Python 정형 설명과 로컬 AI가 허용 후보에서 선택한 문장이 포함됩니다. 각 과제의 방식은 먼저 알리지 않습니다. 계산·상태·질문은 같습니다. 금융 상담이 아닙니다.</p><ul><li>기록: 익명 ID, 답, 읽기·응답 시간, 화면 이탈 여부, 1~5점 평가, 선호와 자유 의견.</li><li>자유 의견에도 이름·연락처·실제 경제정보를 적지 마세요.</li><li>참여와 문항 답변은 자발적이며 언제든 중단할 수 있습니다. ID를 알려 철회할 수 있습니다.</li><li>외부 LLM로 응답을 보내지 않습니다. 이 화면은 서버로 답을 전송하거나 브라우저에 영구 저장하지 않습니다.</li><li>연구자 PC에서 원자료를 비공개 보관하고 최종 보고 후 30일 이내 수동 삭제합니다. 공개 보고는 집계만 사용합니다. 제출 전 의견을 임의 수정하지 않습니다.</li></ul><p>연구자가 참여 여부를 알 수 있으므로 완전한 익명성을 보장하지 않습니다. 저장 전 철회 시 내려받지 않고 닫으세요. 저장 후 철회는 연구자에게 ID로 요청하세요.</p>${session.preview_only?'<p class="notice">SYN001 · 합성 도구 조작 확인. 실제 참가자·실제 이해도 자료가 아닙니다. 총8개 합성 과제와 마지막 보조 비교를 확인합니다.</p>':''}<label><input type="checkbox" id="agree">안내를 이해했고 자발적으로 참여·기록에 동의합니다${session.preview_only?' (QA 조작)':''}.</label><button id="begin" disabled>과제 시작</button></section>`;
document.querySelector('#agree').onchange=e=>document.querySelector('#begin').disabled=!e.target.checked;document.querySelector('#begin').onclick=()=>{consented=true;position=0;records=[];renderTask();};}
function documentText(d){return `<p>${escape(d.summary)}</p>`+d.policy_explanations.map(p=>`<p><b>${escape(p.policy_id)}</b><br>${escape(p.text)}</p>`).join('');}
function common(t){return `<details><summary>합성 사용자 입력 · 변경 전/후</summary><table><thead><tr><th>항목</th><th>전</th><th>후</th></tr></thead><tbody>${Object.keys(t.input.before).map(k=>`<tr><td>${escape(labels[k]||k)}</td><td>${value(t.input.before[k])}</td><td>${value(t.input.after[k])}</td></tr>`).join('')}</tbody></table></details><h3>Python 계산 결과</h3><table><thead><tr><th>항목</th><th>변경 전</th><th>변경 후</th></tr></thead><tbody>${t.facts.money_facts.map(m=>`<tr><td>${escape(m.label)}</td><td>${value(m.before)}원</td><td>${value(m.after)}원</td></tr>`).join('')}</tbody></table><h3>합성 정책 상태</h3><table><thead><tr><th>정책</th><th>변경 전</th><th>변경 후</th></tr></thead><tbody>${t.facts.policy_facts.map(p=>`<tr><td>${escape(p.policy_id)}</td><td>${status[p.before_status]}</td><td>${status[p.after_status]}</td></tr>`).join('')}</tbody></table><details><summary>조건별 근거 · UNKNOWN · 확인사항</summary>${t.facts.policy_facts.map(p=>`<h3>${escape(p.policy_id)}</h3><ul>${p.rules.map(r=>`<li>${escape(labels[r.field]||r.field)}: ${status[r.before_status]} → ${status[r.after_status]} / ${escape(r.after_reason)}${r.input_changed?' / 입력 변경':''}${r.after_missing.length?' / 누락 '+r.after_missing.map(f=>escape(labels[f]||f)).join(', '):''}</li>`).join('')}</ul>`).join('')}<ul>${t.facts.next_actions.map(a=>`<li>${escape(a.text)}</li>`).join('')}</ul></details><p class="muted">${escape(t.disclaimer)}</p><details><summary>계산 가정</summary><ul>${t.facts.assumptions.map(a=>`<li>${escape(a)}</li>`).join('')}</ul></details>`;}
function renderTask(){phase='objective';interrupted=document.hidden;const t=session.tasks[position];app.innerHTML=`${session.preview_only?'<p class="notice">합성 QA 미리보기 · 실제 사람 평가 아님</p>':''}<section><p>${position+1} / ${session.tasks.length} · ${escape(t.task_id)}</p><h2>${escape(t.title)}</h2><div class="card"><h3>결과 설명</h3>${documentText(t.document)}</div>${common(t)}<form id="answers">${t.questions.map(q=>`<fieldset><legend>${escape(q.text)}</legend>${q.choices.map(c=>`<label><input type="${q.multiple?'checkbox':'radio'}" name="${q.id}" value="${escape(c.value)}">${escape(c.label)}</label>`).join('')}</fieldset>`).join('')}<p class="muted">모르면 ‘모르겠다’를 선택할 수 있습니다. 답하지 않은 항목은 미응답으로 남습니다. 제출 후 이전 과제로 돌아가지 않습니다.</p><button type="submit">답변 확정 · 설명 평가</button><button type="button" class="secondary" id="stop">참여 중단</button></form></section>`;
document.querySelector('#answers').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target),row=Object.fromEntries(['data_kind','participant_id','task_id','order','task_status','elapsed_ms','interrupted','q1','q2','q3','q4','ease','trust','usefulness','comment'].map(k=>[k,'']));Object.assign(row,{data_kind:session.data_kind,participant_id:session.participant_id,task_id:t.task_id,order:String(t.order),task_status:'submitted',elapsed_ms:String(Math.round(performance.now()-started)),interrupted:String(interrupted)});for(const q of t.questions){const a=form.getAll(q.id);if(q.multiple&&a.length>1&&(a.includes('DK')||a.includes('NONE'))){msg.textContent='‘모르겠다’ 또는 ‘확인 정보 없음’은 단독으로 선택하세요.';return;}row[q.id]=a.join('|');}records.push(row);msg.textContent='';renderRatings();};document.querySelector('#stop').onclick=stop;started=performance.now();window.scrollTo(0,0);}
function scale(name,label){return `<fieldset><legend>${label} (선택)</legend>${[1,2,3,4,5].map(v=>`<label><input type="radio" name="${name}" value="${v}">${v}점${v===1?' · 매우 낮음':v===5?' · 매우 높음':''}</label>`).join('')}</fieldset>`;}
function renderRatings(){phase='ratings';app.innerHTML=`<section><h2>방금 읽은 설명은 어땠나요?</h2><p>정답은 아직 알려드리지 않습니다. 평가는 선택이며 빈칸도 그대로 보존합니다.</p><form id="ratings">${scale('ease','이해하기 쉬움')}${scale('trust','설명 자체에 대한 신뢰감')}${scale('usefulness','결과를 이해하는 데 도움')}<label>자유 의견 (선택, 개인정보 금지)<textarea name="comment"></textarea></label><button>다음</button><button type="button" class="secondary" id="stop">참여 중단</button></form></section>`;document.querySelector('#ratings').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),r=records.at(-1);for(const k of ['ease','trust','usefulness','comment'])r[k]=d.get(k)||'';position++;if(position<session.tasks.length)renderTask();else renderPreference();};document.querySelector('#stop').onclick=stop;window.scrollTo(0,0);}
function renderPreference(){phase='preference';if(!session.preference){finished=true;finish('started');return;}const p=session.preference;app.innerHTML=`<section><h2>보조 비교 · 주 과제 답변은 확정됐습니다</h2><p>동일한 복합 과제의 두 설명입니다. 아래 공통 계산 결과는 양쪽에 동일합니다.</p><div class="columns"><div class="card"><h3>설명 X</h3>${documentText(p.X.document)}</div><div class="card"><h3>설명 Y</h3>${documentText(p.Y.document)}</div></div>${common(p.X)}<form id="preference"><fieldset><legend>선호하는 설명 (선택)</legend>${[['X','X'],['Y','Y'],['tie','비슷함'],['neither','둘 다 선호하지 않음']].map(([v,l])=>`<label><input type="radio" name="preference" value="${v}">${l}</label>`).join('')}</fieldset><fieldset><legend>다른 설명보다 새롭게 유용한 이해를 준 쪽 (선택)</legend>${[['X','X'],['Y','Y'],['same_information','같은 정보의 표현 차이'],['neither_clear','둘 다 이해에 도움이 부족함'],['not_sure','판단하기 어려움']].map(([v,l])=>`<label><input type="radio" name="added_value" value="${v}">${l}</label>`).join('')}</fieldset><label>그렇게 느낀 문장과 이유 (선택)<textarea name="preference_comment"></textarea></label><button>기록 마침</button></form></section>`;document.querySelector('#preference').onsubmit=e=>{e.preventDefault();session.preferenceAnswer=Object.fromEntries(new FormData(e.target));finished=true;finish('completed');};window.scrollTo(0,0);}
function stop(){if(!confirm('참여를 중단할까요? 원하면 기록을 저장하지 않고 화면을 닫을 수 있습니다.'))return;finish('withdrawn');}
function finish(state){phase='finished';session.exportState=state;app.innerHTML=`<section><h2>${session.preview_only?'합성 도구 확인 종료':'기록 종료'}</h2><p>${records.length}개 과제 기록. ${state==='withdrawn'?'중단/철회 표시로 분석에서 제외됩니다.':''} 제출 버튼은 외부 전송을 하지 않습니다. 저장을 선택하면 JSON 파일이 이 PC에 내려받아집니다.</p><button id="export">${session.preview_only?'합성 QA 기록 내려받기':'기록 JSON 내려받기'}</button><p class="muted">화면을 닫으면 저장하지 않은 답은 사라집니다. 연구자에게 보관 범위를 다시 확인할 수 있습니다.</p></section>`;document.querySelector('#export').onclick=download;window.scrollTo(0,0);}
function download(){const p={data_kind:session.data_kind,participant_id:session.participant_id,allocation_slot:String(session.allocation_slot),consented:String(consented),session_status:session.exportState,preference:session.preferenceAnswer?.preference||'',added_value:session.preferenceAnswer?.added_value||'',preference_comment:session.preferenceAnswer?.preference_comment||''};const data={participant:p,responses:records},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`${session.data_kind}_${session.participant_id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('visibilitychange',()=>{if(phase==='objective'&&document.hidden)interrupted=true;});window.addEventListener('beforeunload',e=>{if(consented&&!finished){e.preventDefault();e.returnValue='';}});load();
</script></html>
