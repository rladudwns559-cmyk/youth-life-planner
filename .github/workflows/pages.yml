# Public site on GitHub Pages: the same frontend-only public mode as the Claude page.
# Runs on every push to main that touches the frontend (or by hand from the Actions tab).
# No server, no secrets: VITE_PUBLIC_BACKEND_PENDING=true builds the static public mode.
name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (lockfile only)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm exec tsc -b
      - name: Build public mode
        env:
          VITE_PUBLIC_BACKEND_PENDING: 'true'
        run: pnpm exec vite build --base=./ --outDir dist-pages --emptyOutDir
      - name: Program pages, sitemap and deadline calendars
        run: node scripts/static-pages.mts dist-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
