# Daily refresh of the nationwide youth-center list from the 온통청년 Open API (getSpace).
# Needs the repository secret YOUTHCENTER_CENTER_KEY. Without it the job ends quietly.
# Only the fields the help panel shows are stored, with the 온통청년 attribution. When the list
# changes it commits the new JSON and starts the Pages deployment.
name: Refresh youth centers (온통청년)

on:
  schedule:
    - cron: '30 21 * * *'  # 06:30 KST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: youthcenter-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTHCENTER_CENTER_KEY: ${{ secrets.YOUTHCENTER_CENTER_KEY }}
    steps:
      - name: Skip when the API key is not registered
        if: env.YOUTHCENTER_CENTER_KEY == ''
        run: echo "YOUTHCENTER_CENTER_KEY secret is not set. Nothing to do."
      - uses: actions/checkout@v4
        if: env.YOUTHCENTER_CENTER_KEY != ''
      - uses: actions/setup-python@v5
        if: env.YOUTHCENTER_CENTER_KEY != ''
        with:
          python-version: '3.12'
      - name: Fetch and normalise
        if: env.YOUTHCENTER_CENTER_KEY != ''
        run: python tools/youthcenter_fetch.py frontend/src/public-data/youth-centers-api.json
      - name: Commit when changed and redeploy
        if: env.YOUTHCENTER_CENTER_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- frontend/src/public-data/youth-centers-api.json; then
            echo "No change in the youth-center list."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/public-data/youth-centers-api.json
          git commit -m "Data: youth-center list refresh $(date -u +%F)"
          git pull --rebase
          git push
          gh workflow run pages.yml --ref main
